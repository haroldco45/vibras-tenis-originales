name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copiar main a gh-pages
        run: git push --force origin HEAD:gh-pages
